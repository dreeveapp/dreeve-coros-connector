version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  settings:
    gosec:
      excludes:
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx
      - path: internal/fakecoros/
        linters:
          - gosec
          - noctx
      - path: internal/coros/client\.go
        text: "G401|G501"
        linters:
          - gosec
      - path: internal/daemon/daemon\.go
        text: "G404"
        linters:
          - gosec
      - path: tools/fitscrub/main\.go
        text: "G703"
        linters:
          - gosec
formatters:
  enable:
    - gofmt
    - goimports
